<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aksara - Quote Generator from AMOGENZ</title>
    
    <!-- Google Fonts: Latin, Display & Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Cairo:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,600;1,400&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #090909;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-hover: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #39FF14; /* Energy Green AMOGENZ */
            --accent-hover: #32E60F;
            --accent-active: #2AC40A;
            --text-primary: #FFFFFF;
            --text-secondary: #E8E8E8;
            --text-tertiary: #888888;
            --text-dark: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 3px;
            color: var(--text-primary);
            line-height: 1;
        }

        .badge-amogenz {
            background: rgba(57, 255, 20, 0.12);
            color: var(--accent-color);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
            border: 1px solid rgba(57, 255, 20, 0.24);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        /* Sticky Preview Section */
        .preview-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 10px;
            z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.4);
        }

        .preview-wrapper {
            width: 100%;
            max-width: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            
            /* Checkerboard Pattern */
            background-color: #121212;
            background-image: 
                linear-gradient(45deg, #090909 25%, transparent 25%),
                linear-gradient(-45deg, #090909 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #090909 75%),
                linear-gradient(-45deg, transparent 75%, #090909 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        #previewImage {
            max-height: 220px;
            width: auto;
            max-width: 100%;
            display: block;
            object-fit: contain;
        }

        @media (min-width: 850px) {
            .main-container {
                display: grid;
                grid-template-columns: 350px 1fr;
                align-items: start;
                gap: 24px;
            }

            .preview-section {
                top: 20px;
                padding: 20px;
            }

            .preview-wrapper {
                max-width: 100%;
            }

            #previewImage {
                max-height: 460px;
            }

            .brand-title {
                font-size: 3.5rem;
            }
        }

        /* Controls Section */
        .controls-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        textarea {
            width: 100%;
            height: 95px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus, select:focus, input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.88rem;
            outline: none;
        }

        .color-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-color); border-radius: 6px; }

        input[type="range"] {
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* Buttons Styling (AMOGENZ Design Rules) */
        .btn-primary {
            background: var(--accent-color);
            color: var(--text-dark);
            font-family: 'Bebas Neue', 'Inter', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            font-weight: 700;
            height: 45px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 5px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-primary:active {
            background: var(--accent-active);
            transform: scale(0.99);
        }

        .file-upload-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .file-upload-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
            background: var(--card-hover);
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <header>
        <h1 class="brand-title">AKSARA</h1>
        <span class="badge-amogenz">from AMOGENZ</span>
    </header>

    <div class="main-container">
        <!-- Area Pratinjau Gambar -->
        <div class="preview-section">
            <div class="preview-wrapper">
                <img id="previewImage" alt="Pratinjau Kutipan">
            </div>
        </div>

        <!-- Panel Kontrol -->
        <div class="controls-section">
            
            <!-- Input Teks -->
            <div class="control-group">
                <label for="textInput">Teks Kutipan</label>
                <textarea id="textInput" placeholder="Tulis kata-katamu di sini... (Mendukung Teks Indonesia & Arab/العربية)">لا تُفَكِّرْ فِي المَفْقُودِ حَتَّى لا تَفْقِدَ المَوْجُودَ</textarea>
            </div>

            <!-- Aspect Ratio & Font -->
            <div class="row-2">
                <div class="control-group">
                    <label for="aspectRatio">Ukuran Canvas</label>
                    <select id="aspectRatio">
                        <option value="9:16" selected>Story / TikTok (9:16)</option>
                        <option value="4:5">Feed IG (4:5)</option>
                        <option value="1:1">Persegi (1:1)</option>
                        <option value="16:9">Landscape (16:9)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="fontSelect">Jenis Font</label>
                    <select id="fontSelect">
                        <!-- Arabic Fonts -->
                        <optgroup label="Font Arab (العربية)">
                            <option value="'Cairo', sans-serif" selected>Cairo (Modern Arab)</option>
                            <option value="'Amiri', serif">Amiri (Klasik/Naskh)</option>
                            <option value="'Tajawal', sans-serif">Tajawal (Minimalis)</option>
                            <option value="'Reem Kufi', sans-serif">Reem Kufi (Kufi Aesthetic)</option>
                        </optgroup>
                        <!-- Latin Fonts -->
                        <optgroup label="Font Latin / Umum">
                            <option value="'Inter', sans-serif">Inter (Clean Modern)</option>
                            <option value="'Montserrat', sans-serif">Montserrat (Bold Modern)</option>
                            <option value="'Playfair Display', serif">Playfair (Aesthetic Serif)</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- Alignment & Ukuran Font -->
            <div class="row-2">
                <div class="control-group">
                    <label for="textAlign">Rata Teks</label>
                    <select id="textAlign">
                        <option value="center" selected>Tengah (Center)</option>
                        <option value="right">Kanan (Right / Arab)</option>
                        <option value="left">Kiri (Left)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="fontSize">Ukuran Font (<span id="fontSizeVal">65</span>px)</label>
                    <input type="range" id="fontSize" min="20" max="150" value="65">
                </div>
            </div>

            <!-- Margin Samping & Jarak Baris -->
            <div class="row-2">
                <div class="control-group">
                    <label for="textMargin">Margin Samping (<span id="textMarginVal">5</span>%)</label>
                    <input type="range" id="textMargin" min="2" max="30" value="5">
                </div>

                <div class="control-group">
                    <label for="lineHeight">Jarak Baris (<span id="lineHeightVal">1.4</span>)</label>
                    <input type="range" id="lineHeight" min="1.0" max="2.2" step="0.1" value="1.4">
                </div>
            </div>

            <!-- Warna Teks & Background -->
            <div class="row-2">
                <div class="control-group">
                    <label for="textColor">Warna Teks</label>
                    <div class="color-inputs">
                        <input type="color" id="textColor" value="#ffffff">
                        <input type="text" id="textColorHex" value="#FFFFFF" style="text-transform: uppercase;">
                    </div>
                </div>

                <div class="control-group">
                    <label for="bgType">Tipe Background</label>
                    <select id="bgType">
                        <option value="transparent" selected>Transparan (Tanpa Background)</option>
                        <option value="solid">Warna Solid</option>
                        <option value="gradient">Gradien Dua Warna</option>
                        <option value="image">Upload Gambar Latar</option>
                    </select>
                </div>
            </div>

            <!-- Controls Dinamis Background Warna -->
            <div id="bgColorControls" class="row-2" style="display: none;">
                <div class="control-group">
                    <label for="bgColor1">Warna Utama</label>
                    <input type="color" id="bgColor1" value="#090909">
                </div>
                <div class="control-group" id="bgColor2Group" style="display: none;">
                    <label for="bgColor2">Warna Gradien Kedua</label>
                    <input type="color" id="bgColor2" value="#1c1c1c">
                </div>
            </div>

            <!-- Controls Upload Gambar (Vector SVG Icon) -->
            <div id="bgImageControls" class="control-group" style="display: none;">
                <label>Pilih Gambar Latar</label>
                <label class="file-upload-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span>Klik untuk upload gambar</span>
                    <input type="file" id="bgFileInput" accept="image/*" style="display: none;">
                </label>
                <label for="overlayOpacity" style="margin-top: 8px;">Kegelapan Overlay (<span id="overlayVal">40</span>%)</label>
                <input type="range" id="overlayOpacity" min="0" max="90" value="40">
            </div>

            <!-- Tombol Download (Vector SVG Icon) -->
            <button class="btn-primary" id="downloadBtn" onclick="downloadImage()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>DOWNLOAD PNG</span>
            </button>

        </div>
    </div>

    <!-- Hidden Canvas untuk Rendering -->
    <canvas id="canvas"></canvas>

    <script>
        // DOM Elements
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const previewImage = document.getElementById('previewImage');

        const textInput = document.getElementById('textInput');
        const aspectRatioSelect = document.getElementById('aspectRatio');
        const fontSelect = document.getElementById('fontSelect');
        const textAlignSelect = document.getElementById('textAlign');
        const fontSizeInput = document.getElementById('fontSize');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const textMarginInput = document.getElementById('textMargin');
        const textMarginVal = document.getElementById('textMarginVal');
        const lineHeightInput = document.getElementById('lineHeight');
        const lineHeightVal = document.getElementById('lineHeightVal');
        const textColorInput = document.getElementById('textColor');
        const textColorHex = document.getElementById('textColorHex');
        
        const bgTypeSelect = document.getElementById('bgType');
        const bgColorControls = document.getElementById('bgColorControls');
        const bgColor1Input = document.getElementById('bgColor1');
        const bgColor2Input = document.getElementById('bgColor2');
        const bgColor2Group = document.getElementById('bgColor2Group');
        const bgImageControls = document.getElementById('bgImageControls');
        const bgFileInput = document.getElementById('bgFileInput');
        const overlayOpacityInput = document.getElementById('overlayOpacity');
        const overlayVal = document.getElementById('overlayVal');

        let uploadedImage = null;

        // Detect Arabic Characters
        function isArabic(text) {
            const arabicPattern = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
            return arabicPattern.test(text);
        }

        // Set Aspect Ratio Canvas
        function updateCanvasDimensions() {
            const ratio = aspectRatioSelect.value;
            switch(ratio) {
                case '9:16':
                    canvas.width = 1080;
                    canvas.height = 1920;
                    break;
                case '4:5':
                    canvas.width = 1080;
                    canvas.height = 1350;
                    break;
                case '1:1':
                    canvas.width = 1080;
                    canvas.height = 1080;
                    break;
                case '16:9':
                    canvas.width = 1920;
                    canvas.height = 1080;
                    break;
            }
        }

        // Multiline Wrapping Function
        function getWrappedLines(context, text, maxWidth) {
            const paragraphs = text.split('\n');
            const lines = [];

            paragraphs.forEach(paragraph => {
                if (paragraph.trim() === '') {
                    lines.push('');
                    return;
                }
                const words = paragraph.split(' ');
                let currentLine = '';

                for (let i = 0; i < words.length; i++) {
                    const word = words[i];
                    const testLine = currentLine ? currentLine + ' ' + word : word;
                    const metrics = context.measureText(testLine);
                    
                    if (metrics.width > maxWidth && currentLine !== '') {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) {
                    lines.push(currentLine);
                }
            });

            return lines;
        }

        // Main Render Image Function
        function renderCanvas() {
            updateCanvasDimensions();
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background
            const bgType = bgTypeSelect.value;
            if (bgType === 'solid') {
                ctx.fillStyle = bgColor1Input.value;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (bgType === 'gradient') {
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, bgColor1Input.value);
                grad.addColorStop(1, bgColor2Input.value);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (bgType === 'image' && uploadedImage) {
                const imgRatio = uploadedImage.width / uploadedImage.height;
                const canvasRatio = canvas.width / canvas.height;
                let drawWidth, drawHeight, x, y;

                if (imgRatio > canvasRatio) {
                    drawHeight = canvas.height;
                    drawWidth = canvas.height * imgRatio;
                    x = (canvas.width - drawWidth) / 2;
                    y = 0;
                } else {
                    drawWidth = canvas.width;
                    drawHeight = canvas.width / imgRatio;
                    x = 0;
                    y = (canvas.height - drawHeight) / 2;
                }
                ctx.drawImage(uploadedImage, x, y, drawWidth, drawHeight);

                // Overlay Gelap
                const opacity = overlayOpacityInput.value / 100;
                ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Draw Text
            const rawText = textInput.value || 'Tulis kata-katamu...';
            const fontSize = parseInt(fontSizeInput.value, 10);
            const selectedFont = fontSelect.value;
            const align = textAlignSelect.value;
            const lHeightRatio = parseFloat(lineHeightInput.value);

            // Perhitungan Dynamic Padding/Margin
            const marginPercent = parseInt(textMarginInput.value, 10) / 100;
            const padding = canvas.width * marginPercent;
            const maxWidth = canvas.width - (padding * 2);

            ctx.fillStyle = textColorInput.value;
            ctx.font = `bold ${fontSize}px ${selectedFont}`;
            
            // RTL & Direction Detection
            const hasArabic = isArabic(rawText);
            ctx.direction = hasArabic ? 'rtl' : 'ltr';

            // Alignment Positioning (Sync dengan Margin)
            let textX = canvas.width / 2;
            if (align === 'left') {
                textX = padding;
            } else if (align === 'right') {
                textX = canvas.width - padding;
            }
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';

            // Soft Shadow
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 4;

            // Wrap Text Calculation
            const lines = getWrappedLines(ctx, rawText, maxWidth);

            const lineHeightPx = fontSize * lHeightRatio;
            const totalTextHeight = (lines.length - 1) * lineHeightPx;
            const startY = (canvas.height - totalTextHeight) / 2;

            lines.forEach((line, index) => {
                ctx.fillText(line, textX, startY + (index * lineHeightPx));
            });

            // Reset Shadow
            ctx.shadowBlur = 0;

            // Update Preview Image
            previewImage.src = canvas.toDataURL('image/png');
        }

        // Debounce Helper
        function debounce(func, delay = 80) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), delay);
            };
        }

        const debouncedRender = debounce(renderCanvas, 60);

        // Event Listeners
        textInput.addEventListener('input', debouncedRender);
        aspectRatioSelect.addEventListener('change', renderCanvas);
        
        fontSelect.addEventListener('change', () => {
            document.fonts.ready.then(renderCanvas);
        });

        textAlignSelect.addEventListener('change', renderCanvas);
        
        fontSizeInput.addEventListener('input', (e) => {
            fontSizeVal.textContent = e.target.value;
            debouncedRender();
        });

        textMarginInput.addEventListener('input', (e) => {
            textMarginVal.textContent = e.target.value;
            debouncedRender();
        });

        lineHeightInput.addEventListener('input', (e) => {
            lineHeightVal.textContent = e.target.value;
            debouncedRender();
        });

        textColorInput.addEventListener('input', (e) => {
            textColorHex.value = e.target.value;
            debouncedRender();
        });

        textColorHex.addEventListener('input', (e) => {
            if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                textColorInput.value = e.target.value;
                debouncedRender();
            }
        });

        bgTypeSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            bgColorControls.style.display = (val === 'solid' || val === 'gradient') ? 'grid' : 'none';
            bgColor2Group.style.display = (val === 'gradient') ? 'flex' : 'none';
            bgImageControls.style.display = (val === 'image') ? 'flex' : 'none';
            renderCanvas();
        });

        bgColor1Input.addEventListener('input', debouncedRender);
        bgColor2Input.addEventListener('input', debouncedRender);

        bgFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImage = img;
                        renderCanvas();
                    }
                    img.src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        overlayOpacityInput.addEventListener('input', (e) => {
            overlayVal.textContent = e.target.value;
            debouncedRender();
        });

        // Download Image Function (Saved as Aksara [amogenz].png)
        function downloadImage() {
            const link = document.createElement('a');
            const timeStamp = new Date().getTime();
            link.download = `Aksara_[amogenz]_${timeStamp}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        // Initialize App
        document.fonts.ready.then(() => {
            renderCanvas();
        });
    </script>
</body>
</html>
